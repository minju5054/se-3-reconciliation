[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "se3-reconciliation"
version = "0.1.0"
description = "Successive navigation action-chunk reconciliation experiments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.9,<4",
    "numpy>=2,<3",
    "PyYAML>=6,<7",
    "scipy>=1.14,<2",
    "shapely>=2.0,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
derivatives = ["jax[cpu]==0.7.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
