  F2: alpha_look_le_15deg_and_B_to_F_k_ge_0.20m_and_abs_J_RAW_minus_J_M3_le_0.10_J_RAW_rank_max_gap
  unavailable_policy: NOT_AVAILABLE_do_not_relax

