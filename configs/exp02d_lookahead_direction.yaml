  S1: RAW_BENIGN_and_M1_non_BENIGN_and_M3_BENIGN_rank_max_J_M1_minus_J_M3
  S2: RAW_CHALLENGING_and_J_M3_lt_J_RAW_and_J_M3_lt_J_M2_rank_max_J_RAW_minus_J_M3
