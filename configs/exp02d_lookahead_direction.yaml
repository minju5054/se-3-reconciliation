methods:
  - M0_RAW
  - M1_HISTORICAL_M4
  - M2_NO_DIRECTION
  - M3_LOOKAHEAD

# Copied exactly from the frozen EXP-02A/EXP-02C current-M4 source of truth.
residual_scales:
  translation_m: 0.10
  yaw_rad: 0.10
  direction_unitless: 0.10
historical_weights:
  entry_preservation: 1.0
  incoming_direction: 1.0
  incoming_yaw: 1.0
  fresh_motion: 1.0
minimum_direction_translation_m: 1.0e-6

# Copied exactly from the frozen EXP-02A/EXP-02C solver source of truth.
solver:
  max_iterations: 80
  finite_difference_epsilon: 1.0e-6
  initial_damping: 1.0e-3
  damping_increase: 10.0
  damping_decrease: 0.3
  maximum_damping: 1.0e12
  gradient_tolerance: 1.0e-9
  step_tolerance: 1.0e-9
  cost_tolerance: 1.0e-12

oracle:
  source: frozen_DATA02_TrajectoryFollower_evaluated_once_at_B
  lookahead_distance_source: each_saved_run_config
  expected_lookahead_distance_m: 0.25
  first_command_absolute_tolerance: 1.0e-12

evaluation:
  command_score_linear_scale_mps: 0.15
  command_score_angular_scale_rps: 0.30
  benign_max_abs_delta_v_mps: 0.05
  benign_max_abs_delta_omega_rps: 0.10
  challenging_min_abs_delta_v_mps: 0.15
  challenging_min_abs_delta_omega_rps: 0.30
  challenging_improved_ratio: 0.80
  challenging_worse_ratio: 1.20
  bootstrap_seed: 20260910
  bootstrap_repetitions: 10000
  confidence_level: 0.95

execution:
  primary_workers: 1
  progress_interval: 25

# Frozen before primary execution. These bins are descriptive regime probes,
# not deployment gates and not objective terms.
regimes:
  alpha_entry_large_rad: 1.0471975511965976
  alpha_look_small_rad: 0.2617993877991494
  alpha_look_large_rad: 0.7853981633974483
  positional_gap_large_m: 0.20
  degenerate_lookahead_radius_m: 0.05
  insufficient_lookahead_arc_m: 0.05
  large_deformation_rms_m: 0.20
  small_command_benefit_fraction: 0.10
  rigid_fit_translation_rms_m: 1.0e-6
  rigid_fit_yaw_rms_rad: 1.0e-6
  rigid_correction_min_entry_m: 0.05
  rigid_endpoint_entry_difference_m: 1.0e-6
  latency_bin_edges_s: [0.60, 0.80]

representatives:
