  final_test_set: false
  data02_combined_decision: DATA02_COMBINED_DIVERSITY_INSUFFICIENT
  candidate_execution: false
  lightnav_waypoint_timestamps: false
  only_semantic_change: B_to_F_k_direction_target_becomes_B_to_F_q

paths:
  output_root: data/exp02d_lookahead_direction
