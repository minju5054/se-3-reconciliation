  v1_run: data/data02_online_successive_v1/data02-online-successive-primary-v1
  v2_run: data/data02_online_successive_v2/data02-online-successive-extension-v2
  historical_exp02a_config: configs/exp02a_spatial_entry.yaml
  historical_exp02c_config: configs/exp02c_factor_isolation.yaml

