conventions:
  augmented_path: '[R0, O0, ..., O(N-1)]; R0->O0 is a simulation-side spatial connector'
  interpolation: XY arc length; shortest-angle endpoint yaw; zero XY lengths have no arc duration
  exact_vertex: lowest positive-length segment ending at target progress
  insufficient: OLD_ARC_INSUFFICIENT; never clamp or replace
  reproducibility: exact shape, dtype, values and deterministic NPY array hash; mismatch invalidates primary metrics
  fresh_anchor: actual R1_old observation pose readback, within 1e-7 of the planned pose
  primary_boundary: planned R1_old exactly; tau=0, no added spatial advance
  direction_comparison: previous saved yaw-axis incoming versus new augmented OLD geometric tangent; both definitions explicit
  frames: world metres, right-handed Z up, CCW yaw radians; column vectors T_target_source
  timing: no intrinsic waypoint time; capture/readiness host clocks explicit; actual execution null
