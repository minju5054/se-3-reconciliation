geometry:
  # Sub-millimetre XY edges make atan2-based tangents numerically unstable and
  # are undefined for this descriptor; pose-yaw progression remains recorded.
  segment_epsilon_m: 1.0e-3
  curvature_zero_epsilon_per_m: 1.0e-9
  intrinsic_waypoint_time_base: false
  descriptor_distance:
    # Every center/scale/outside radius is derived only from the seven Stage 0-E
    # fixtures. LightNav descriptors are never used to fit the comparison space.
    normalization: stage0e_fixture_min_max_range
    scale_floor: 1.0e-9
    features:
      - path_length_m
      - endpoint_displacement_m
      - abs_net_pose_yaw_change_rad
      - cumulative_abs_pose_yaw_change_rad
      - max_abs_pose_yaw_increment_rad
      - pose_yaw_per_meter_p95_abs_rad_per_m
      - tangent_curvature_p95_abs_per_m
      - cumulative_abs_tangent_turn_rad
      - max_abs_lateral_departure_m
      - curvature_sign_change_count
    outside_rule: maximum_fixture_leave_one_out_nearest_distance
    ambiguous_margin_fraction_of_outside_radius: 0.10
  severity_order:
    - tangent_curvature_p95_abs_per_m
    - cumulative_abs_tangent_turn_rad
    - max_abs_pose_yaw_increment_rad
  severity_direction: ascending_easy_to_hard_lexicographic

execution:
  maximum_unique_references: 80
  repetitions: 3
  calibrated_mode: frozen_stage0d_candidate_from_stage0e
  nominal_scope: geometry_frozen_representatives_only
  historical_controller_commands_reused: false
  canonicalize_references: false
  old_start_pose: robot_pose_at_old_observation
  fresh_start_pose: robot_pose_at_fresh_observation
  scene: official_jackal_flat_ground_without_added_obstacles
  acceptance_criteria_source: frozen_stage0e_config_snapshot

representatives:
  selection_before_execution: true
  median_rule: lower_middle_after_severity_sort
  rules:
    - lowest_severity_old
    - median_severity_old
    - highest_severity_old
    - lowest_severity_fresh
    - median_severity_fresh
    - highest_severity_fresh
    - nearest_strong_turn_failing_fixture
    - highest_sign_change_reference_if_any
  merge_duplicate_kind_and_world_hash: true

gui:
  real_time_factor: 1.0
  inter_mode_hold_wall_s: 1.0
  final_hold: true
  visualization:
    z_offset_m: 0.72
    reference_color_rgba: [0.10, 0.45, 1.00, 1.00]
    nominal_color_rgba: [1.00, 0.25, 0.10, 1.00]
    calibrated_color_rgba: [0.10, 1.00, 0.20, 1.00]
    observation_marker_color_rgba: [0.95, 0.20, 0.95, 1.00]
    line_width: 5.0
    marker_size: 14.0
    heading_marker_stride: 2
    heading_marker_length_m: 0.14
    camera_height_m: 4.0
