endpoint_position_m: 0.10
endpoint_yaw_deg: 15.0
endpoint_dwell_s: 0.30
endpoint_sample_tolerance_s: 1.0e-12
endpoint_dwell_name: original-FRESH endpoint dwell time
endpoint_null_policy: absent complete following dwell remains null; never cap-imputed
fixed_cap: nominal 3 s is the historical 180 intervals, actual 180 * source dt; incomplete cap metrics null
path_length: integral of absolute held linear commands over execution intervals before endpoint dwell start
mean_abs_v: path length / endpoint dwell start time; null for zero-duration or unobserved dwell
post_attach: endpoint dwell start minus attachment start only when both are observed; no clamping
sign_tolerance: 1.0e-09
substantially_more_remaining_arc_m: 0.10
majority_AUC: C3 .9 original-FRESH position AUC lower than Full in at least 3 of 4 sources
systematically_later_endpoint: strictly more than half of sources with an observed Native or Full endpoint dwell have C3 later or null versus at least one observed baseline
tradeoff: any source/baseline pair with both attachments observed, C3 earlier, and endpoint later/lost or >.10 m more original arc at attachment
classification_priority: [TECHNICAL_BLOCKED, ENTRY_REFERENCE_FAILURE, FAST_ATTACHMENT_SLOW_COMPLETION_TRADEOFF, ENTRY_TRANSITION_AND_COMPLETION_SUPPORTED, ENTRY_PROGRESS_INSUFFICIENT]
classification_rules:
  TECHNICAL_BLOCKED: authentication/restoration/interface/validator/runtime schedule failure or stale identity implementation failure
  ENTRY_REFERENCE_FAILURE: unsafe complete reference, execution safety abort/clearance failure, or official numerical controller error after successful restoration
  FAST_ATTACHMENT_SLOW_COMPLETION_TRADEOFF: any frozen paired tradeoff; show every pair, no net improvement claim
  ENTRY_TRANSITION_AND_COMPLETION_SUPPORTED: majority lower AUC; at least one baseline endpoint observed; no systematic later/lost endpoint; safety and entry identity checks pass
  ENTRY_PROGRESS_INSUFFICIENT: remaining valid cases; progress preservation alone not supported by joint transition/completion criteria
