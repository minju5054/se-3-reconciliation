entry_indices: [0, 3, 6]
methods: [raw_f0, raw_k, pose_anchor, rigid, graph]

# M2 and M4 are loaded verbatim from configs/exp02a_spatial_entry.yaml.
# EXP-02B does not introduce controller residuals or tune graph factors.
graph_contract:
  pose_anchor_variant: pose_anchor
  graph_variant: incoming_motion_aware
  objective_unchanged_from_exp02a: true
  controller_residuals: false
  selector_implemented: false
  z_evidence_used: false

metrics:
  inter_k_first_pose_count: 3
  improvement_denominator_epsilon: 1.0e-9

execution:
  physics_dt: 0.016666666666666666
  control_dt: 0.1
  settling_duration_s: 1.0
  spawn_height_m: 0.15
  branch_duration_s: 2.0
  headless: true
  replay_source_old_commands: true
  exact_boundary_state_reset_after_gate: true
  command_window: 3
  comparability_gate:
    # Three deterministic replays of case_high_delta_omega reproduced B exactly
    # at stored float precision. These frozen gates therefore equal measured
    # max error (0) plus the predeclared 5 mm / 0.01 rad margins.
    frozen_after_qualification: true
    translation_tolerance_m: 0.005
    yaw_tolerance_rad: 0.01
    command_tolerance: 1.0e-12
    qualification_repetitions: 3
    margin_translation_m: 0.005
    margin_yaw_rad: 0.01
